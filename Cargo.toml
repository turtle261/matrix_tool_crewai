[package]
name = "matrix-api"
version = "0.1.2"
edition = "2021"
authors = ["Turtle261"]
license = "AGPL-3.0" # All associated files are under this AGPL-3.0 License.
build = "build.rs"

[dependencies]
actix-web = "4.4"
matrix-sdk = "0.6"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
derive_more = "0.99"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
toml = "0.8"
log4rs = {version = "1.3.0", optional=true}
anyhow = {version = "1.0.86", optional=true}
log = "0.4"
thiserror = "1.0"
sha1_smol = "1.0.0"
async-trait = "0.1.74"
url = "2.5.0"
env_logger = "0.10"

[dev-dependencies]
webbrowser = "0.8"
chrono = "0.4"
log = "0.4"
